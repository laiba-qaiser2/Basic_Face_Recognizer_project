<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; background-color: #fff; color: #000; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #0056b3; }
        .msg { color: red; text-align: center; font-size: 14px; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 15px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Enter Email" autocomplete="off">
    <input type="password" id="password" placeholder="Enter Password" autocomplete="off">
    <button type="button" onclick="loginUser()">Login</button>
    <p class="msg" id="error-msg"></p>
    <div class="link">Don't have an account? <a href="/register">Register here</a></div>
</div>

<script>
    async function loginUser() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("error-msg");

        if (!email || !password) {
            errorMsg.innerText = "Please fill in all fields.";
            return;
        }

        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (data.status === "success") {
                window.location.href = "/";
            } else {
                errorMsg.innerText = data.message;
            }
        } catch (error) {
            errorMsg.innerText = "Error connecting to server.";
        }
    }
</script>
</body>
</html>
